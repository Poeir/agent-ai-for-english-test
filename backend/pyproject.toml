[tool.poetry]
name = "gofive-english-test"
version = "0.1.0"
description = "AI-powered English test question generation system"
authors = ["Gofive Internship"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"
pydantic-settings = "^2.3"
openai = "^1.35"
langgraph = "^0.2"
langchain-openai = "^0.1"
pgvector = "^0.3"
httpx = "^0.27"
python-dotenv = "^1.0"
langgraph-cli = {extras = ["inmem"], version = "^0.1"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
