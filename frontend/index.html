<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Test Generation — Pipeline Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .node-card { transition: all 0.25s ease; }
    .node-pending  { border-color: #d1d5db; background: #f9fafb; opacity: 0.55; }
    .node-active   { border-color: #2563eb; background: #eff6ff; box-shadow: 0 0 0 4px rgba(37,99,235,0.12); }
    .node-done     { border-color: #16a34a; background: #f0fdf4; }
    .node-failed   { border-color: #dc2626; background: #fef2f2; }
    pre.json {
      background: #0f172a; color: #e2e8f0; padding: 12px;
      border-radius: 6px; font-size: 12px; max-height: 320px;
      overflow: auto; white-space: pre-wrap; word-break: break-word;
    }
    .pretty {
      background: #f8fafc; color: #0f172a; padding: 12px;
      border-radius: 6px; font-size: 13px; max-height: 320px;
      overflow: auto; border: 1px solid #e2e8f0;
    }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid #93c5fd; border-top-color: #2563eb;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .arrow { color: #9ca3af; font-size: 22px; user-select: none; }
    .tab-btn { padding: 8px 16px; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; color: #6b7280; cursor: pointer; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }
    .toggle-btn { font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; border: 1px solid #d1d5db; background: white; color: #374151; }
    .toggle-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    .opt-row { display: flex; gap: 8px; padding: 6px 10px; border-radius: 4px; margin-bottom: 4px; align-items: flex-start; }
    .opt-correct { background: #dcfce7; border: 1px solid #16a34a; }
    .opt-wrong { background: #f9fafb; border: 1px solid #e5e7eb; }
    .opt-letter { font-weight: 700; min-width: 22px; }
    .score-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .score-good { background: #dcfce7; color: #15803d; }
    .score-mid { background: #fef9c3; color: #a16207; }
    .score-bad { background: #fee2e2; color: #b91c1c; }
    table.db-table { width: 100%; font-size: 13px; }
    table.db-table th { text-align: left; padding: 8px 10px; background: #f3f4f6; color: #374151; font-weight: 600; border-bottom: 1px solid #e5e7eb; }
    table.db-table td { padding: 8px 10px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
    table.db-table tr:hover { background: #f9fafb; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-completed { background: #dcfce7; color: #15803d; }
    .badge-running { background: #dbeafe; color: #1d4ed8; }
    .badge-pending { background: #f3f4f6; color: #4b5563; }
    .badge-failed { background: #fee2e2; color: #b91c1c; }
    .badge-validated { background: #dcfce7; color: #15803d; }
    .badge-draft { background: #fef3c7; color: #92400e; }
    .ambig-low { background: #dcfce7; color: #15803d; }
    .ambig-medium { background: #fef9c3; color: #a16207; }
    .ambig-high { background: #fee2e2; color: #b91c1c; }
    .score-bar-wrap { background: #e5e7eb; border-radius: 4px; height: 6px; width: 100%; overflow: hidden; }
    .score-bar { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .score-bar.good { background: #16a34a; }
    .score-bar.mid  { background: #ca8a04; }
    .score-bar.bad  { background: #dc2626; }
    .issue-chip { display: inline-block; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;
                  padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px 4px 2px 0; }
    .sugg-chip  { display: inline-block; background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe;
                  padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px 4px 2px 0; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-4 flex items-end justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">English Test Generation</h1>
        <p class="text-gray-600 mt-1">LangGraph pipeline viewer + database browser.</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-500">View:</span>
        <button id="viewRaw" class="toggle-btn">Raw JSON</button>
        <button id="viewPretty" class="toggle-btn active">Pretty</button>
      </div>
    </header>

    <!-- Top tabs -->
    <nav class="flex border-b border-gray-200 mb-6">
      <button class="tab-btn active" data-tab="pipeline">Pipeline</button>
      <button class="tab-btn" data-tab="database">Database</button>
    </nav>

    <!-- ===================== PIPELINE TAB ===================== -->
    <div id="tab-pipeline">
      <!-- Input form -->
      <section class="bg-white rounded-lg shadow p-5 mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Requirement</label>
        <textarea id="requirement" rows="3"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="e.g., Generate 3 B1-level reading comprehension questions about climate change."></textarea>

        <div class="flex items-center gap-4 mt-3">
          <label class="text-sm text-gray-700">Item count</label>
          <input id="itemCount" type="number" value="3" min="1" max="20"
            class="w-20 border border-gray-300 rounded-md px-2 py-1 text-sm" />

          <button id="runBtn"
            class="ml-auto bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-md disabled:bg-gray-400">
            Run pipeline
          </button>
        </div>

        <div id="jobMeta" class="mt-3 text-xs text-gray-500 hidden">
          <span>job_id: <code id="jobId" class="text-gray-700"></code></span>
          <span class="mx-2">·</span>
          <span>status: <strong id="jobStatus" class="text-gray-700"></strong></span>
          <span class="mx-2">·</span>
          <span>current: <strong id="jobCurrent" class="text-gray-700"></strong></span>
        </div>
      </section>

      <!-- Pipeline flow -->
      <section class="flex flex-wrap items-stretch justify-center gap-2 mb-6">
        <div id="card-blueprint" class="node-card node-pending border-2 rounded-lg px-4 py-3 w-44 text-center">
          <div class="text-xs uppercase text-gray-500">Node 1</div>
          <div class="font-semibold text-gray-800">blueprint</div>
          <div class="text-xs text-gray-500 mt-1" id="status-blueprint">waiting</div>
        </div>
        <div class="arrow self-center">→</div>

        <div id="card-generator" class="node-card node-pending border-2 rounded-lg px-4 py-3 w-44 text-center">
          <div class="text-xs uppercase text-gray-500">Node 2</div>
          <div class="font-semibold text-gray-800">generator</div>
          <div class="text-xs text-gray-500 mt-1" id="status-generator">waiting</div>
        </div>
        <div class="arrow self-center">→</div>

        <div id="card-distractor" class="node-card node-pending border-2 rounded-lg px-4 py-3 w-44 text-center">
          <div class="text-xs uppercase text-gray-500">Node 3</div>
          <div class="font-semibold text-gray-800">distractor</div>
          <div class="text-xs text-gray-500 mt-1" id="status-distractor">waiting</div>
        </div>
        <div class="arrow self-center">→</div>

        <div id="card-judge" class="node-card node-pending border-2 rounded-lg px-4 py-3 w-44 text-center">
          <div class="text-xs uppercase text-gray-500">Node 4</div>
          <div class="font-semibold text-gray-800">judge</div>
          <div class="text-xs text-gray-500 mt-1" id="status-judge">waiting</div>
        </div>
      </section>

      <section id="panels" class="space-y-4"></section>

      <footer class="text-center text-xs text-gray-400 mt-10">
        Polling <code>/api/v1/jobs/{job_id}</code> every 1s.
      </footer>
    </div>

    <!-- ===================== DATABASE TAB ===================== -->
    <div id="tab-database" class="hidden">
      <div class="flex border-b border-gray-200 mb-4">
        <button class="tab-btn active" data-dbtab="passages">Tests (grouped)</button>
        <button class="tab-btn" data-dbtab="items">All Questions (flat)</button>
        <button class="tab-btn" data-dbtab="jobs">Generation Jobs</button>
      </div>

      <!-- Passages (grouped) sub-tab -->
      <div id="dbtab-passages">
        <div class="bg-white rounded-lg shadow p-4 mb-4 flex flex-wrap items-end gap-3">
          <div>
            <label class="block text-xs text-gray-600 mb-1">CEFR</label>
            <select id="filterPassageCefr" class="border border-gray-300 rounded px-2 py-1 text-sm">
              <option value="">All</option>
              <option>A1</option><option>A2</option><option>B1</option>
              <option>B2</option><option>C1</option><option>C2</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Skill</label>
            <input id="filterPassageSkill" class="border border-gray-300 rounded px-2 py-1 text-sm" placeholder="e.g. reading" />
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Topic</label>
            <input id="filterPassageTopic" class="border border-gray-300 rounded px-2 py-1 text-sm" placeholder="contains…" />
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Limit</label>
            <input id="filterPassageLimit" type="number" value="20" min="1" max="100" class="w-20 border border-gray-300 rounded px-2 py-1 text-sm" />
          </div>
          <button id="reloadPassages" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-1.5 rounded">Reload</button>
        </div>
        <div id="passagesList" class="space-y-4">
          <p class="text-sm text-gray-500">Loading…</p>
        </div>
      </div>

      <!-- Items (flat) sub-tab -->
      <div id="dbtab-items" class="hidden">
        <div class="bg-white rounded-lg shadow p-4 mb-4 flex flex-wrap items-end gap-3">
          <div>
            <label class="block text-xs text-gray-600 mb-1">CEFR</label>
            <select id="filterCefr" class="border border-gray-300 rounded px-2 py-1 text-sm">
              <option value="">All</option>
              <option>A1</option><option>A2</option><option>B1</option>
              <option>B2</option><option>C1</option><option>C2</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Status</label>
            <select id="filterStatus" class="border border-gray-300 rounded px-2 py-1 text-sm">
              <option value="">All</option>
              <option value="validated">validated</option>
              <option value="draft">draft</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Type</label>
            <input id="filterType" class="border border-gray-300 rounded px-2 py-1 text-sm" placeholder="e.g. main_idea" />
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Limit</label>
            <input id="filterLimit" type="number" value="50" min="1" max="200" class="w-20 border border-gray-300 rounded px-2 py-1 text-sm" />
          </div>
          <button id="reloadItems" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-1.5 rounded">Reload</button>
        </div>
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <div id="itemsTableWrap" class="overflow-x-auto">
            <p class="p-6 text-sm text-gray-500">Loading…</p>
          </div>
        </div>
      </div>

      <!-- Jobs sub-tab -->
      <div id="dbtab-jobs" class="hidden">
        <div class="bg-white rounded-lg shadow p-4 mb-4 flex flex-wrap items-end gap-3">
          <div>
            <label class="block text-xs text-gray-600 mb-1">Status</label>
            <select id="filterJobStatus" class="border border-gray-300 rounded px-2 py-1 text-sm">
              <option value="">All</option>
              <option value="pending">pending</option>
              <option value="running">running</option>
              <option value="completed">completed</option>
              <option value="failed">failed</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Limit</label>
            <input id="filterJobLimit" type="number" value="20" min="1" max="100" class="w-20 border border-gray-300 rounded px-2 py-1 text-sm" />
          </div>
          <button id="reloadJobs" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-1.5 rounded">Reload</button>
        </div>
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <div id="jobsTableWrap" class="overflow-x-auto">
            <p class="p-6 text-sm text-gray-500">Loading…</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (location.origin.startsWith("http")) ? location.origin : "http://localhost:8000";

    // ====================== Global view mode ======================
    let viewMode = "pretty"; // or "raw"
    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById("viewRaw").classList.toggle("active", mode === "raw");
      document.getElementById("viewPretty").classList.toggle("active", mode === "pretty");
      if (lastJob) updateUI(lastJob, lastRequirement);
    }
    document.getElementById("viewRaw").addEventListener("click", () => setViewMode("raw"));
    document.getElementById("viewPretty").addEventListener("click", () => setViewMode("pretty"));

    // ====================== Top tab switching ======================
    document.querySelectorAll(".tab-btn[data-tab]").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn[data-tab]").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        const tab = b.dataset.tab;
        document.getElementById("tab-pipeline").classList.toggle("hidden", tab !== "pipeline");
        document.getElementById("tab-database").classList.toggle("hidden", tab !== "database");
        if (tab === "database") {
          if (!passagesLoaded) loadPassages();
          if (!jobsLoaded) loadJobs();
        }
      });
    });
    document.querySelectorAll(".tab-btn[data-dbtab]").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn[data-dbtab]").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        const sub = b.dataset.dbtab;
        document.getElementById("dbtab-passages").classList.toggle("hidden", sub !== "passages");
        document.getElementById("dbtab-items").classList.toggle("hidden", sub !== "items");
        document.getElementById("dbtab-jobs").classList.toggle("hidden", sub !== "jobs");
        if (sub === "passages" && !passagesLoaded) loadPassages();
        if (sub === "items" && !itemsLoaded) loadItems();
      });
    });

    // ====================== Pipeline ======================
    const NODES = [
      {
        key: "blueprint",
        nodeName: "run_blueprint",
        title: "Blueprint Agent",
        desc: "Parses free-text requirement → structured JSON blueprint.",
        getInput: (req, trace) => ({ raw_requirement: req?.raw_requirement }),
        getOutput: (trace) => trace?.blueprint ?? null,
        prettyOutput: (data) => prettyBlueprint(data),
      },
      {
        key: "generator",
        nodeName: "run_generator",
        title: "Generator Agent",
        desc: "Reads blueprint → produces a passage and question stems with correct answers.",
        getInput: (req, trace) => ({ blueprint: trace?.blueprint ?? null }),
        getOutput: (trace) => ({ passage: trace?.passage ?? null, raw_questions: trace?.raw_questions ?? null }),
        prettyOutput: (data) => prettyGenerator(data),
      },
      {
        key: "distractor",
        nodeName: "run_distractor",
        title: "Distractor Agent",
        desc: "Adds plausible wrong-answer options (A/B/C/D) to each question stem.",
        getInput: (req, trace) => ({ raw_questions: trace?.raw_questions ?? null }),
        getOutput: (trace) => ({ questions_with_options: trace?.questions_with_options ?? null }),
        prettyOutput: (data) => prettyDistractor(data?.questions_with_options),
      },
      {
        key: "judge",
        nodeName: "run_judge",
        title: "Judge Agent",
        desc: "Scores each question on CEFR alignment, distractor quality, grammar, ambiguity.",
        getInput: (req, trace) => ({
          passage: trace?.passage ?? null,
          questions: trace?.questions_with_options ?? trace?.raw_questions ?? null,
          target_cefr: trace?.blueprint?.cefr ?? null,
        }),
        getOutput: (trace) => ({
          judge_results: trace?.judge_results ?? null,
          judge_passed: trace?.judge_passed ?? null,
          revision_count: trace?.revision_count ?? 0,
        }),
        prettyOutput: (data) => prettyJudge(data),
      },
    ];

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function fmtJson(v) {
      if (v === null || v === undefined) return "—";
      if (typeof v === "string") return v;
      return JSON.stringify(v, null, 2);
    }
    function scoreClass(s) {
      if (s == null) return "score-bad";
      if (s >= 8) return "score-good";
      if (s >= 6) return "score-mid";
      return "score-bad";
    }

    // -------- Pretty renderers --------
    function prettyBlueprint(b) {
      if (!b) return `<div class="text-gray-400 text-sm">No data</div>`;
      const rows = [
        ["Skill", b.skill],
        ["CEFR Level", b.cefr],
        ["Topic", b.topic],
        ["Item Count", b.item_count],
        ["Question Types", Array.isArray(b.question_types) ? b.question_types.join(", ") : b.question_types],
      ];
      return `
        <dl class="grid grid-cols-[140px_1fr] gap-x-3 gap-y-1.5 text-sm">
          ${rows.map(([k, v]) => `
            <dt class="font-semibold text-gray-600">${escapeHtml(k)}</dt>
            <dd class="text-gray-900">${escapeHtml(v ?? "—")}</dd>
          `).join("")}
        </dl>`;
    }
    function prettyGenerator(d) {
      if (!d || (!d.passage && !d.raw_questions)) return `<div class="text-gray-400 text-sm">No data</div>`;
      const passage = d.passage ? `
        <div class="mb-3">
          <div class="text-xs font-semibold text-gray-500 uppercase mb-1">Passage</div>
          <div class="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed">${escapeHtml(d.passage)}</div>
        </div>` : "";
      const qs = (d.raw_questions || []).map((q, i) => `
        <div class="mb-2 pb-2 border-b border-gray-200 last:border-b-0">
          <div class="text-sm font-medium text-gray-800">Q${i+1}. ${escapeHtml(q.stem || q.question || "")}</div>
          <div class="text-xs text-gray-600 mt-0.5">Answer: <span class="font-semibold text-green-700">${escapeHtml(q.correct_answer || q.answer || "—")}</span></div>
          ${q.question_type ? `<div class="text-xs text-gray-500">Type: ${escapeHtml(q.question_type)}</div>` : ""}
        </div>`).join("");
      return passage + (qs ? `<div><div class="text-xs font-semibold text-gray-500 uppercase mb-1">Questions</div>${qs}</div>` : "");
    }
    function prettyDistractor(items) {
      if (!items || !items.length) return `<div class="text-gray-400 text-sm">No data</div>`;
      return items.map((q, i) => {
        const opts = q.options || {};
        const correct = q.correct_answer;
        const letters = ["A", "B", "C", "D"];
        return `
          <div class="mb-3 pb-3 border-b border-gray-200 last:border-b-0">
            <div class="text-sm font-medium text-gray-800 mb-1.5">Q${i+1}. ${escapeHtml(q.stem || "")}</div>
            ${letters.map((L) => `
              <div class="opt-row ${L === correct ? "opt-correct" : "opt-wrong"}">
                <span class="opt-letter">${L}.</span>
                <span class="text-sm text-gray-800">${escapeHtml(opts[L] || "—")}</span>
                ${L === correct ? `<span class="ml-auto text-xs font-semibold text-green-700">✓ correct</span>` : ""}
              </div>`).join("")}
          </div>`;
      }).join("");
    }
    function scoreBarClass(s) {
      if (s == null) return "bad";
      if (s >= 8) return "good";
      if (s >= 6) return "mid";
      return "bad";
    }
    function scoreBar(label, value, max = 10) {
      const v = value == null ? 0 : Math.max(0, Math.min(max, Number(value)));
      const pct = (v / max) * 100;
      const cls = scoreBarClass(value);
      return `
        <div class="mb-2">
          <div class="flex justify-between text-xs mb-0.5">
            <span class="text-gray-600">${escapeHtml(label)}</span>
            <span class="font-semibold text-gray-800">${value ?? "—"}<span class="text-gray-400"> / ${max}</span></span>
          </div>
          <div class="score-bar-wrap"><div class="score-bar ${cls}" style="width:${pct}%"></div></div>
        </div>`;
    }
    function prettyJudge(d) {
      if (!d || !d.judge_results) return `<div class="text-gray-400 text-sm">No data</div>`;
      const passCount = d.judge_results.filter((r) => r.pass === true).length;
      const total = d.judge_results.length;
      const avgOverall = total
        ? (d.judge_results.reduce((s, r) => s + (r.overall_score || 0), 0) / total).toFixed(2)
        : "—";

      const overallBadge = d.judge_passed === true
        ? `<span class="score-pill score-good">PASS</span>`
        : d.judge_passed === false
          ? `<span class="score-pill score-bad">FAIL</span>`
          : "";

      const header = `
        <div class="bg-slate-50 border border-slate-200 rounded-md p-3 mb-3">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-sm font-semibold text-gray-700">Overall verdict:</span>
            ${overallBadge}
            <span class="text-xs text-gray-600 ml-1">${passCount} / ${total} passed</span>
            <span class="text-gray-300">·</span>
            <span class="text-xs text-gray-600">avg <span class="score-pill ${scoreClass(parseFloat(avgOverall))}">${avgOverall}</span></span>
            <span class="text-gray-300">·</span>
            <span class="text-xs text-gray-600">revisions: <strong>${d.revision_count ?? 0}</strong></span>
          </div>
        </div>`;

      const rows = d.judge_results.map((r) => {
        const issues = Array.isArray(r.issues) ? r.issues : [];
        const suggestions = Array.isArray(r.revision_suggestions) ? r.revision_suggestions : [];
        const ambig = r.ambiguity_risk;
        const ambigClass = ambig === "low" ? "ambig-low" : ambig === "medium" ? "ambig-medium" : ambig === "high" ? "ambig-high" : "badge-pending";

        return `
          <div class="border border-gray-200 rounded-md p-3 mb-2 bg-white">
            <div class="flex items-center gap-2 flex-wrap mb-2 pb-2 border-b border-gray-100">
              <span class="text-sm font-bold text-gray-800">Q${(r.question_index ?? 0) + 1}</span>
              <span class="text-xs text-gray-500">overall</span>
              <span class="score-pill ${scoreClass(r.overall_score)}">${r.overall_score ?? "—"}</span>
              ${r.pass === true
                ? `<span class="score-pill score-good">pass</span>`
                : r.pass === false
                  ? `<span class="score-pill score-bad">fail</span>` : ""}
              <span class="text-gray-300">·</span>
              <span class="text-xs text-gray-600">ambiguity</span>
              <span class="score-pill ${ambigClass}">${escapeHtml(ambig ?? "—")}</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-x-4 gap-y-1">
              ${scoreBar("CEFR alignment", r.cefr_alignment)}
              ${scoreBar("Distractor quality", r.distractor_quality)}
              ${scoreBar("Grammar naturalness", r.grammar_naturalness)}
            </div>
            ${issues.length ? `
              <div class="mt-2">
                <div class="text-xs font-semibold text-red-700 mb-1">Issues (${issues.length})</div>
                <div>${issues.map((s) => `<span class="issue-chip">${escapeHtml(s)}</span>`).join("")}</div>
              </div>` : ""}
            ${suggestions.length ? `
              <div class="mt-2">
                <div class="text-xs font-semibold text-blue-700 mb-1">Revision suggestions (${suggestions.length})</div>
                <div>${suggestions.map((s) => `<span class="sugg-chip">${escapeHtml(s)}</span>`).join("")}</div>
              </div>` : ""}
            ${!issues.length && !suggestions.length
              ? `<div class="mt-2 text-xs text-gray-400 italic">No issues reported.</div>`
              : ""}
          </div>`;
      }).join("");

      return header + rows;
    }

    function panelHtml(node) {
      return `
        <div id="panel-${node.key}" class="bg-white rounded-lg shadow border border-gray-200">
          <header class="flex items-center justify-between px-5 py-3 border-b border-gray-100">
            <div>
              <div class="text-xs uppercase tracking-wide text-gray-500">${node.nodeName}</div>
              <div class="font-semibold text-gray-800">${node.title}</div>
            </div>
            <div id="badge-${node.key}" class="text-xs px-2 py-1 rounded-full bg-gray-200 text-gray-700">waiting</div>
          </header>
          <p class="px-5 pt-3 text-sm text-gray-600">${node.desc}</p>
          <div class="grid md:grid-cols-2 gap-4 p-5">
            <div>
              <div class="text-xs font-semibold text-gray-500 mb-1">INPUT</div>
              <div id="input-${node.key}" class="pretty">—</div>
            </div>
            <div>
              <div class="text-xs font-semibold text-gray-500 mb-1">OUTPUT</div>
              <div id="output-${node.key}" class="pretty">—</div>
            </div>
          </div>
        </div>`;
    }
    function renderPanels() {
      document.getElementById("panels").innerHTML = NODES.map(panelHtml).join("");
    }
    function setNodeStatus(key, status) {
      const card = document.getElementById(`card-${key}`);
      const label = document.getElementById(`status-${key}`);
      const badge = document.getElementById(`badge-${key}`);
      card.classList.remove("node-pending", "node-active", "node-done", "node-failed");
      if (status === "active") {
        card.classList.add("node-active");
        label.innerHTML = `<span class="spinner"></span> running`;
        badge.className = "text-xs px-2 py-1 rounded-full bg-blue-100 text-blue-700";
        badge.textContent = "running";
      } else if (status === "done") {
        card.classList.add("node-done");
        label.textContent = "done ✓";
        badge.className = "text-xs px-2 py-1 rounded-full bg-green-100 text-green-700";
        badge.textContent = "done";
      } else if (status === "failed") {
        card.classList.add("node-failed");
        label.textContent = "failed ✗";
        badge.className = "text-xs px-2 py-1 rounded-full bg-red-100 text-red-700";
        badge.textContent = "failed";
      } else {
        card.classList.add("node-pending");
        label.textContent = "waiting";
        badge.className = "text-xs px-2 py-1 rounded-full bg-gray-200 text-gray-700";
        badge.textContent = "waiting";
      }
    }

    function renderPanelContent(node, requestState, trace) {
      const inputData = node.getInput(requestState, trace);
      const outputData = node.getOutput(trace);
      const inputEl = document.getElementById(`input-${node.key}`);
      const outputEl = document.getElementById(`output-${node.key}`);
      if (!inputEl || !outputEl) return;

      if (viewMode === "raw") {
        inputEl.className = "json";
        outputEl.className = "json";
        inputEl.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-word;">${escapeHtml(fmtJson(inputData))}</pre>`;
        outputEl.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-word;">${escapeHtml(fmtJson(outputData))}</pre>`;
      } else {
        inputEl.className = "pretty";
        outputEl.className = "pretty";
        // Input: always pretty-print JSON (it's small)
        if (inputData == null || (typeof inputData === "object" && Object.values(inputData).every((v) => v == null))) {
          inputEl.innerHTML = `<div class="text-gray-400 text-sm">No data</div>`;
        } else {
          inputEl.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-word;font-size:12px;">${escapeHtml(fmtJson(inputData))}</pre>`;
        }
        outputEl.innerHTML = node.prettyOutput(outputData);
      }
    }

    let lastJob = null;
    let lastRequirement = "";

    function updateUI(job, requirementText) {
      lastJob = job;
      lastRequirement = requirementText;
      document.getElementById("jobMeta").classList.remove("hidden");
      document.getElementById("jobId").textContent = job.job_id;
      document.getElementById("jobStatus").textContent = job.status;
      document.getElementById("jobCurrent").textContent = job.current_node ?? "—";

      const trace = job.result?.trace ?? {};
      const requestState = { raw_requirement: requirementText, ...job.request };
      const current = job.current_node;
      const status = job.status;

      const has = {
        blueprint: !!trace.blueprint,
        generator: trace.passage != null || trace.raw_questions != null,
        distractor: trace.questions_with_options != null,
        judge: trace.judge_results != null,
      };

      NODES.forEach((node) => {
        let nodeStatus = "pending";
        if (has[node.key]) nodeStatus = "done";
        if (status === "running" && current === node.nodeName) nodeStatus = "active";
        if (status === "failed" && current === node.nodeName) nodeStatus = "failed";
        setNodeStatus(node.key, nodeStatus);
        renderPanelContent(node, requestState, trace);
      });

      if (status === "failed" && job.error_message) {
        document.getElementById("jobStatus").innerHTML =
          `<span class="text-red-600">failed</span> — ${escapeHtml(job.error_message)}`;
      }
    }

    let pollHandle = null;
    let currentJobId = null;
    async function pollJob(requirementText) {
      if (!currentJobId) return;
      try {
        const res = await fetch(`${API_BASE}/api/v1/jobs/${currentJobId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const job = await res.json();
        updateUI(job, requirementText);
        if (job.status === "completed" || job.status === "failed") {
          clearInterval(pollHandle);
          pollHandle = null;
          document.getElementById("runBtn").disabled = false;
          document.getElementById("runBtn").textContent = "Run pipeline";
        }
      } catch (e) { console.error("poll error", e); }
    }
    async function runPipeline() {
      const requirement = document.getElementById("requirement").value.trim();
      const itemCount = parseInt(document.getElementById("itemCount").value, 10) || 3;
      if (!requirement) { alert("Please enter a requirement."); return; }
      NODES.forEach((n) => {
        setNodeStatus(n.key, "pending");
        const ip = document.getElementById(`input-${n.key}`);
        const op = document.getElementById(`output-${n.key}`);
        if (ip) ip.innerHTML = "—";
        if (op) op.innerHTML = "—";
      });
      lastJob = null;
      const btn = document.getElementById("runBtn");
      btn.disabled = true;
      btn.textContent = "Running…";
      try {
        const res = await fetch(`${API_BASE}/api/v1/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requirement, item_count: itemCount }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const job = await res.json();
        currentJobId = job.job_id;
        document.getElementById("jobMeta").classList.remove("hidden");
        document.getElementById("jobId").textContent = job.job_id;
        document.getElementById("jobStatus").textContent = job.status;
        if (pollHandle) clearInterval(pollHandle);
        pollHandle = setInterval(() => pollJob(requirement), 1000);
      } catch (e) {
        alert("Failed to start job: " + e.message);
        btn.disabled = false;
        btn.textContent = "Run pipeline";
      }
    }

    // ====================== Database tab ======================
    let passagesLoaded = false, itemsLoaded = false, jobsLoaded = false;

    async function loadPassages() {
      const wrap = document.getElementById("passagesList");
      wrap.innerHTML = `<p class="text-sm text-gray-500">Loading…</p>`;
      const params = new URLSearchParams();
      const cefr = document.getElementById("filterPassageCefr").value;
      const skill = document.getElementById("filterPassageSkill").value.trim();
      const topic = document.getElementById("filterPassageTopic").value.trim();
      const limit = document.getElementById("filterPassageLimit").value || 20;
      if (cefr) params.set("cefr", cefr);
      if (skill) params.set("skill", skill);
      if (topic) params.set("topic", topic);
      params.set("limit", limit);
      try {
        const res = await fetch(`${API_BASE}/api/v1/passages?${params.toString()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const passages = await res.json();
        passagesLoaded = true;
        if (!passages.length) {
          wrap.innerHTML = `<p class="text-sm text-gray-500 p-4">No tests found.</p>`;
          return;
        }
        wrap.innerHTML = passages.map((p, pi) => {
          const qs = (p.questions || []).slice().sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""));
          const validatedCount = qs.filter((q) => q.status === "validated").length;
          const avgScore = qs.length
            ? (qs.reduce((s, q) => s + (q.judge_score || 0), 0) / qs.length).toFixed(2)
            : "—";
          return `
            <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
              <header class="px-5 py-3 border-b border-gray-100 bg-slate-50 flex items-center justify-between flex-wrap gap-2">
                <div>
                  <div class="text-xs uppercase text-gray-500">Test #${pi + 1} · passage <code class="text-gray-700">${escapeHtml((p.id || "").slice(0, 8))}…</code></div>
                  <div class="font-semibold text-gray-800 mt-0.5">
                    ${escapeHtml(p.topic || "(no topic)")}
                    <span class="text-xs text-gray-500 font-normal ml-2">${escapeHtml(p.skill || "—")} · ${escapeHtml(p.cefr_level || "—")} · ${p.word_count ?? "?"} words</span>
                  </div>
                </div>
                <div class="text-xs text-gray-600 flex items-center gap-2 flex-wrap">
                  <span>${qs.length} question${qs.length === 1 ? "" : "s"}</span>
                  <span class="text-gray-300">·</span>
                  <span><span class="badge badge-validated">${validatedCount} validated</span></span>
                  <span class="text-gray-300">·</span>
                  <span>avg score <span class="score-pill ${scoreClass(parseFloat(avgScore))}">${avgScore}</span></span>
                  <button class="toggle-btn ml-2" data-toggle-passage="${pi}">Show passage</button>
                </div>
              </header>
              <div id="passage-body-${pi}" class="hidden px-5 py-3 border-b border-gray-100 bg-amber-50">
                <div class="text-xs font-semibold text-gray-500 uppercase mb-1">Passage text</div>
                <div class="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed">${escapeHtml(p.content || "")}</div>
              </div>
              <div class="p-4 space-y-3">
                ${qs.map((q, qi) => `
                  <div class="border border-gray-200 rounded-md p-3">
                    <div class="flex items-start justify-between gap-3 flex-wrap">
                      <div class="text-sm font-medium text-gray-800 flex-1">
                        <span class="text-gray-500 mr-1">Q${qi + 1}.</span>${escapeHtml(q.stem || "—")}
                      </div>
                      <div class="flex items-center gap-1.5 flex-wrap text-xs">
                        ${q.question_type ? `<span class="badge badge-pending">${escapeHtml(q.question_type)}</span>` : ""}
                        <span class="badge badge-${escapeHtml(q.status || "draft")}">${escapeHtml(q.status || "—")}</span>
                        <span class="score-pill ${scoreClass(q.judge_score)}">${q.judge_score ?? "—"}</span>
                      </div>
                    </div>
                    ${q.options ? `
                      <div class="mt-2">
                        ${["A","B","C","D"].map((L) => `
                          <div class="opt-row ${L === q.correct_answer ? "opt-correct" : "opt-wrong"}">
                            <span class="opt-letter">${L}.</span>
                            <span class="text-sm text-gray-800">${escapeHtml(q.options?.[L] ?? "—")}</span>
                            ${L === q.correct_answer ? `<span class="ml-auto text-xs font-semibold text-green-700">✓ correct</span>` : ""}
                          </div>`).join("")}
                      </div>
                    ` : `
                      <div class="mt-2 text-xs text-gray-500">
                        Correct answer (no MCQ options stored): <strong class="text-gray-800">${escapeHtml(q.correct_answer || "—")}</strong>
                      </div>
                    `}
                  </div>
                `).join("")}
              </div>
            </div>`;
        }).join("");

        wrap.querySelectorAll("[data-toggle-passage]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = btn.dataset.togglePassage;
            const body = document.getElementById(`passage-body-${idx}`);
            const isHidden = body.classList.toggle("hidden");
            btn.textContent = isHidden ? "Show passage" : "Hide passage";
          });
        });
      } catch (e) {
        wrap.innerHTML = `<p class="text-sm text-red-600 p-4">Failed to load passages: ${escapeHtml(e.message)}</p>`;
      }
    }

    async function loadItems() {
      const wrap = document.getElementById("itemsTableWrap");
      wrap.innerHTML = `<p class="p-6 text-sm text-gray-500">Loading…</p>`;
      const params = new URLSearchParams();
      const cefr = document.getElementById("filterCefr").value;
      const status = document.getElementById("filterStatus").value;
      const qtype = document.getElementById("filterType").value.trim();
      const limit = document.getElementById("filterLimit").value || 50;
      if (cefr) params.set("cefr", cefr);
      if (status) params.set("status", status);
      if (qtype) params.set("question_type", qtype);
      params.set("limit", limit);
      try {
        const res = await fetch(`${API_BASE}/api/v1/items?${params.toString()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const items = await res.json();
        itemsLoaded = true;
        if (!items.length) {
          wrap.innerHTML = `<p class="p-6 text-sm text-gray-500">No items found.</p>`;
          return;
        }
        wrap.innerHTML = `
          <table class="db-table">
            <thead>
              <tr>
                <th>#</th><th>Stem</th><th>Type</th><th>CEFR</th>
                <th>Correct</th><th>Score</th><th>Status</th><th>Rev</th><th>Created</th>
              </tr>
            </thead>
            <tbody>
              ${items.map((it, i) => `
                <tr class="item-row" data-idx="${i}" style="cursor:pointer;">
                  <td>${i + 1}</td>
                  <td class="max-w-md"><div class="truncate">${escapeHtml(it.stem || "—")}</div></td>
                  <td>${escapeHtml(it.question_type || "—")}</td>
                  <td>${escapeHtml(it.cefr_level || "—")}</td>
                  <td><strong>${escapeHtml(it.correct_answer || "—")}</strong></td>
                  <td><span class="score-pill ${scoreClass(it.judge_score)}">${it.judge_score ?? "—"}</span></td>
                  <td><span class="badge badge-${escapeHtml(it.status || "draft")}">${escapeHtml(it.status || "—")}</span></td>
                  <td>${it.revision_count ?? 0}</td>
                  <td class="text-xs text-gray-500">${escapeHtml((it.created_at || "").slice(0, 19).replace("T", " "))}</td>
                </tr>
                <tr id="exp-${i}" class="hidden bg-slate-50">
                  <td colspan="9" class="p-4">
                    ${it.options ? `
                      <div class="mb-2 text-xs font-semibold text-gray-600 uppercase">Options</div>
                      ${["A","B","C","D"].map(L => `
                        <div class="opt-row ${L === it.correct_answer ? "opt-correct" : "opt-wrong"}">
                          <span class="opt-letter">${L}.</span>
                          <span class="text-sm text-gray-800">${escapeHtml(it.options?.[L] ?? "—")}</span>
                          ${L === it.correct_answer ? `<span class="ml-auto text-xs font-semibold text-green-700">✓ correct</span>` : ""}
                        </div>`).join("")}
                    ` : `<div class="text-xs text-gray-500">No options stored.</div>`}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;
        wrap.querySelectorAll(".item-row").forEach((row) => {
          row.addEventListener("click", () => {
            const idx = row.dataset.idx;
            document.getElementById(`exp-${idx}`).classList.toggle("hidden");
          });
        });
      } catch (e) {
        wrap.innerHTML = `<p class="p-6 text-sm text-red-600">Failed to load items: ${escapeHtml(e.message)}</p>`;
      }
    }

    async function loadJobs() {
      const wrap = document.getElementById("jobsTableWrap");
      wrap.innerHTML = `<p class="p-6 text-sm text-gray-500">Loading…</p>`;
      const params = new URLSearchParams();
      const status = document.getElementById("filterJobStatus").value;
      const limit = document.getElementById("filterJobLimit").value || 20;
      if (status) params.set("status", status);
      params.set("limit", limit);
      try {
        const res = await fetch(`${API_BASE}/api/v1/jobs?${params.toString()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const jobs = await res.json();
        jobsLoaded = true;
        if (!jobs.length) {
          wrap.innerHTML = `<p class="p-6 text-sm text-gray-500">No jobs found.</p>`;
          return;
        }
        wrap.innerHTML = `
          <table class="db-table">
            <thead>
              <tr>
                <th>#</th><th>Job ID</th><th>Status</th><th>Current</th>
                <th>Requirement</th><th>Items</th><th>Created</th><th>Completed</th>
              </tr>
            </thead>
            <tbody>
              ${jobs.map((j, i) => {
                const itemCount = j.result?.item_ids?.length ?? "—";
                const req = j.request?.requirement ?? "—";
                return `
                <tr>
                  <td>${i + 1}</td>
                  <td class="font-mono text-xs">${escapeHtml((j.job_id || "").slice(0, 8))}…</td>
                  <td><span class="badge badge-${escapeHtml(j.status)}">${escapeHtml(j.status || "—")}</span></td>
                  <td class="text-xs">${escapeHtml(j.current_node || "—")}</td>
                  <td class="max-w-md"><div class="truncate">${escapeHtml(req)}</div></td>
                  <td>${itemCount}</td>
                  <td class="text-xs text-gray-500">${escapeHtml((j.created_at || "").slice(0, 19).replace("T", " "))}</td>
                  <td class="text-xs text-gray-500">${escapeHtml((j.completed_at || "").slice(0, 19).replace("T", " "))}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>`;
      } catch (e) {
        wrap.innerHTML = `<p class="p-6 text-sm text-red-600">Failed to load jobs: ${escapeHtml(e.message)}</p>`;
      }
    }

    document.getElementById("reloadPassages").addEventListener("click", loadPassages);
    document.getElementById("reloadItems").addEventListener("click", loadItems);
    document.getElementById("reloadJobs").addEventListener("click", loadJobs);

    renderPanels();
    document.getElementById("runBtn").addEventListener("click", runPipeline);
  </script>
</body>
</html>
